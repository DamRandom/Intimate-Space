<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeed6" />
      <stop offset="50%" stop-color="#cfb78a" />
      <stop offset="100%" stop-color="#9a7f4e" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a16" />
      <stop offset="100%" stop-color="#090c0a" />
    </linearGradient>
  </defs>

  <!-- Base redondeada con borde sutil -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#cfb78a" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Círculo interior zen de precisión -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#cfb78a" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 3" />

  <!-- Monograma E & I refinado en proporción áurea -->
  <g fill="url(#goldGrad)">
    <!-- Letra E -->
    <path d="M 21 21 L 33 21 C 33.6 21 34 21.4 34 22 C 34 22.6 33.6 23 33 23 L 23.5 23 L 23.5 30.5 L 31.5 30.5 C 32.1 30.5 32.5 30.9 32.5 31.5 C 32.5 32.1 32.1 32.5 31.5 32.5 L 23.5 32.5 L 23.5 41 L 33.5 41 C 34.1 41 34.5 41.4 34.5 42 C 34.5 42.6 34.1 43 33.5 43 L 21 43 C 20.4 43 20 42.6 20 42 L 20 22 C 20 21.4 20.4 21 21 21 Z" />
    
    <!-- Letra I (Columna vertical simétrica a la derecha) -->
    <path d="M 40 21 L 44 21 C 44.6 21 45 21.4 45 22 C 45 22.6 44.6 23 44 23 L 43 23 L 43 41 L 44 41 C 44.6 41 45 41.4 45 42 C 45 42.6 44.6 43 44 43 L 40 43 C 39.4 43 39 42.6 39 42 C 39 41.4 39.4 41 40 41 L 41 41 L 41 23 L 40 23 C 39.4 23 39 22.6 39 22 C 39 21.4 39.4 21 40 21 Z" />
  </g>

  <!-- Detalle superior de lujo (pequeño diamante dorado) -->
  <polygon points="32,12 34,14.5 32,17 30,14.5" fill="url(#goldGrad)" opacity="0.9" />
</svg>
